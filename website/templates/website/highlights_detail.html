{% extends "website/base.html" %}
{% load static %}

{% block content %}
<div class="site-blocks-cover overlay inner-page" style="background-image: url({% if post.cover_url %}{{ post.cover_url }}{% else %}{% static 'website/dente/images/replacements/fisioup_hero_background.png' %}{% endif %});" data-aos="fade" data-stellar-background-ratio="0.5">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-8">
        <span class="sub-text">Destaque</span>
        <h1><strong>{{ post.title }}</strong></h1>
      </div>
    </div>
  </div>
</div>

<div class="site-section bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="post-entry bg-white">
          {% if post.cover_url %}
            <div class="image">
              <img src="{{ post.cover_url }}" alt="{{ post.title }}" class="img-fluid">
            </div>
          {% endif %}
          <div class="text p-5">
            <p class="mb-4"><a href="{% url 'website:highlights' %}">&larr; Voltar aos destaques</a></p>
            <span class="text-uppercase date d-block mb-3"><small>{{ post.published|date:'d M, Y' }}</small></span>
            {% if post.excerpt %}<p class="lead">{{ post.excerpt }}</p>{% endif %}
            <div class="post-detail-body">{{ post.body|linebreaks }}</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
