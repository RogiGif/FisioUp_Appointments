<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f8fb;font-family:Arial,sans-serif;color:#1c2630;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f8fb;">
      <tr>
        <td align="center" style="padding:24px;">
          <table width="640" cellpadding="0" cellspacing="0" style="max-width:640px;width:100%;background:#ffffff;border-radius:16px;border:1px solid #e5eef5;">
            <tr>
              <td style="padding:24px;">
                <table width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="font-size:18px;font-weight:700;">
                      {% if logo_url %}
                        <img src="{{ logo_url }}" alt="{{ clinic_name }}" style="height:36px;vertical-align:middle;margin-right:8px;" />
                      {% endif %}
                      {{ clinic_name }}
                    </td>
                  </tr>
                </table>
                <div style="font-size:16px;font-weight:600;margin:16px 0 12px;">{% block title %}{% endblock %}</div>
                <div style="font-size:14px;line-height:1.5;color:#3b4b5f;">{% block content %}{% endblock %}</div>
              </td>
            </tr>
          </table>
          <div style="font-size:12px;color:#7a8896;margin-top:12px;white-space:pre-line;">
            {% if footer_text %}{{ footer_text }}{% endif %}
            {% if signature_text %}<br>{{ signature_text }}{% endif %}
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
