{% load static %}
<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="keyword" content="">
    <meta name="author" content="theme_ocean">
    <title>Fisio-UP | Recuperar password</title>
    <link rel="shortcut icon" type="image/png" href="{% static 'core/images/favicon.png' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'duralux/assets/css/bootstrap.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'duralux/assets/vendors/css/vendors.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'duralux/assets/css/theme.min.css' %}">
    <!--[if lt IE 9]>
			<script src="https:oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
			<script src="https:oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
		<![endif]-->
</head>

<body>
    <main class="auth-minimal-wrapper">
        <div class="auth-minimal-inner">
            <div class="minimal-card-wrapper">
                <div class="card mb-4 mt-5 mx-4 mx-sm-0 position-relative">
                    <div class="wd-50 bg-white p-2 rounded-circle shadow-lg position-absolute translate-middle top-0 start-50">
                        <img src="{% static 'core/images/logo_fifioUP.svg' %}" alt="Fisio-UP" class="img-fluid">
                    </div>
                    <div class="card-body p-sm-5">
                        <h2 class="fs-20 fw-bolder mb-4">Recuperar password</h2>
                        <h4 class="fs-13 fw-bold mb-2">Receber link de recuperação</h4>
                        <p class="fs-12 fw-medium text-muted">Indica o teu email para receberes o link de recuperação.</p>

                        <form method="post" novalidate class="w-100 mt-4 pt-2">
                            {% csrf_token %}
                            <div class="mb-4">
                                <input type="email" name="{{ form.email.name }}" class="form-control{% if form.email.errors %} is-invalid{% endif %}"
                                       placeholder="Email" value="{{ form.email.value|default_if_none:'' }}" required>
                                {% if form.email.errors %}
                                    <div class="invalid-feedback d-block">{{ form.email.errors|striptags }}</div>
                                {% endif %}
                            </div>
                            <div class="mt-4 d-flex flex-wrap gap-2">
                                <button type="submit" class="btn btn-lg btn-primary">Enviar email</button>
                                <a class="btn btn-lg btn-outline-secondary" href="/login/">Voltar ao login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="{% static 'duralux/assets/vendors/js/vendors.min.js' %}"></script>
    <script src="{% static 'duralux/assets/js/common-init.min.js' %}"></script>
</body>

</html>
