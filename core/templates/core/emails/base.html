<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f8fb;font-family:Arial,sans-serif;color:#1c2630;">
    <div style="max-width:640px;margin:0 auto;padding:24px;">
      <div style="background:#ffffff;border-radius:16px;padding:24px;border:1px solid #e5eef5;">
        <div style="font-size:18px;font-weight:700;margin-bottom:8px;">{{ clinic_name }}</div>
        <div style="font-size:16px;font-weight:600;margin:0 0 12px;">{{ heading }}</div>
        <div style="font-size:14px;line-height:1.5;color:#3b4b5f;white-space:pre-line;">{{ message }}</div>
      </div>
      <div style="font-size:12px;color:#7a8896;margin-top:12px;">Email automático do sistema de marcações.</div>
    </div>
  </body>
</html>
