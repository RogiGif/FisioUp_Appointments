{% extends "core/calendar_shell.html" %}
{% load static %}

{% block extra_head %}
    <link type="text/css" rel="stylesheet" href="{% static 'duralux/assets/vendors/css/tui-calendar.min.css' %}">
    <link type="text/css" rel="stylesheet" href="{% static 'duralux/assets/vendors/css/tui-theme.min.css' %}">
    <link type="text/css" rel="stylesheet" href="{% static 'duralux/assets/vendors/css/tui-time-picker.min.css' %}">
    <link type="text/css" rel="stylesheet" href="{% static 'duralux/assets/vendors/css/tui-date-picker.min.css' %}">
    <link type="text/css" rel="stylesheet" href="{% static 'core/css/calendar_layout.css' %}?v=20260221-4">
<style>
        /* Calendar view dropdown: keep only Diário/Semanal/Mensal */
        #dropdownMenu-calendarType + .dropdown-menu [data-action="toggle-weeks2"],
        #dropdownMenu-calendarType + .dropdown-menu [data-action="toggle-weeks3"],
        #dropdownMenu-calendarType + .dropdown-menu [data-action="toggle-workweek"],
        #dropdownMenu-calendarType + .dropdown-menu [data-action="toggle-start-day-1"],
        #dropdownMenu-calendarType + .dropdown-menu [data-action="toggle-narrow-weekend"],
        #dropdownMenu-calendarType + .dropdown-menu .dropdown-divider {
            display: none !important;
        }
        /* Hide milestone/task/all-day legends if rendered by TUI */
        .tui-full-calendar-legend,
        .tui-full-calendar-legend-item,
        .tui-full-calendar-legend-select {
            display: none !important;
        }
        /* Slot text color for readability */
        .tui-full-calendar-time-schedule-content,
        .tui-full-calendar-time-schedule-content-time {
            color: #6c757d !important;
        }
        .tui-full-calendar-time-schedule-content .schedule-text-past,
        .tui-full-calendar-time-schedule-content-time .schedule-text-past {
            color: #adb5bd !important;
        }
        .tui-full-calendar-time-schedule-content .schedule-text,
        .tui-full-calendar-time-schedule-content-time .schedule-text {
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tui-full-calendar-time-schedule-content .schedule-time,
        .tui-full-calendar-time-schedule-content-time .schedule-time {
            flex: 0 0 auto;
            font-weight: 700;
        }
        .tui-full-calendar-time-schedule-content .schedule-title,
        .tui-full-calendar-time-schedule-content-time .schedule-title,
        .tui-full-calendar-time-schedule-content .schedule-meta,
        .tui-full-calendar-time-schedule-content-time .schedule-meta {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tui-full-calendar-time-schedule-content .schedule-title,
        .tui-full-calendar-time-schedule-content-time .schedule-title {
            font-weight: 600;
        }
        .tui-full-calendar-time-schedule-content .schedule-meta,
        .tui-full-calendar-time-schedule-content-time .schedule-meta {
            opacity: 0.85;
        }
        .tui-full-calendar-time-schedule-content .schedule-lock-icon,
        .tui-full-calendar-time-schedule-content-time .schedule-lock-icon {
            font-size: 12px;
            flex: 0 0 auto;
        }
        /* Remove blur/strong dim on modal backdrop for calendar quick booking */
        body.modal-open .nxl-container,
        body.modal-open .nxl-content {
            filter: none !important;
        }
        .modal-backdrop,
        .modal-backdrop.show {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            opacity: 0.2 !important;
        }
        .schedule-text-blocked {
            color: #1f2937;
            font-weight: 600;
        }
        @media (max-width: 1919.98px) {
            .tui-full-calendar-time-schedule-content .schedule-meta,
            .tui-full-calendar-time-schedule-content-time .schedule-meta {
                display: none;
            }
        }
        @media (max-width: 1599.98px) {
            .tui-full-calendar-time-schedule-content .schedule-time,
            .tui-full-calendar-time-schedule-content-time .schedule-time {
                display: none;
            }
        }
    </style>
{% endblock %}

{% block extra_scripts %}
    <script src="{% static 'duralux/assets/vendors/js/tui-code-snippet.min.js' %}"></script>
    <script src="{% static 'duralux/assets/vendors/js/tui-time-picker.min.js' %}"></script>
    <script src="{% static 'duralux/assets/vendors/js/tui-date-picker.min.js' %}"></script>
    <script src="{% static 'duralux/assets/vendors/js/moment.min.js' %}"></script>
    <script src="{% static 'duralux/assets/vendors/js/tui-calendar.min.js' %}"></script>
    {{ calendar_data|json_script:"calendar-data" }}
    <script src="{% static 'core/js/pro-calendar-init.js' %}?v=20260310-2"></script>
    <script src="{% static 'core/js/calendar_layout.js' %}?v=20260221-10"></script>
{% endblock %}
