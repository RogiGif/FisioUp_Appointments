{% load static %}
<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="keyword" content="">
    <meta name="author" content="theme_ocean">
    <title>{% block title %}Fisio-UP{% endblock %}</title>
    <link rel="shortcut icon" type="image/png" href="{% static 'core/images/favicon.png' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'duralux/assets/css/bootstrap.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'duralux/assets/vendors/css/vendors.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'duralux/assets/css/theme.min.css' %}">
</head>

<body>
    <main class="auth-minimal-wrapper">
        <div class="auth-minimal-inner">
            <div class="minimal-card-wrapper">
                <div class="card mb-4 mt-5 mx-4 mx-sm-0 position-relative">
                    <div class="wd-100 ht-100 bg-white p-2 rounded-circle shadow-lg position-absolute translate-middle start-50" style="top:-28px;">
                        <img src="{% static 'core/images/logo_fisioUP_alto.svg' %}" alt="Fisio-UP" class="img-fluid" style="width:100%;height:100%;object-fit:contain;">
                    </div>
                    <div class="card-body p-sm-5" style="padding-top:9rem;">
                        <h2 class="fs-20 fw-bolder mb-3">{% block page_title %}{% endblock %}</h2>
                        {% block page_subtitle %}{% endblock %}
                        {% block content %}{% endblock %}
                        <div class="mt-4 text-center">
                            <a href="{% url 'home' %}" class="btn btn-primary" style="background-color:#00B6DF;border-color:#00B6DF;">Voltar</a>
                        </div>
                    </div>
                </div>
                <div class="mt-4 text-muted text-center fs-11">
                    © 2026 FisioUp — Plataforma de Marcações Online
                </div>
            </div>
        </div>
    </main>
</body>
</html>
